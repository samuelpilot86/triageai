name: Keep HuggingFace Space alive

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes
  workflow_dispatch:        # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          url="https://samuelpilot-triageai.hf.space/api/health"
          for attempt in 1 2 3 4 5 6; do
            if curl -sf --max-time 30 "$url"; then
              echo "Space is alive (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt failed, Space may be starting"
            sleep 15
          done
          echo "Space did not respond"
          exit 1
